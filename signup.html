<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign up</title>
  <style>
    :root { --accent: #1f5f45; --line: #e2e4de; --muted: #6b716c; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 15px/1.5 system-ui, sans-serif; color: #1c1f1d; background: #f6f7f4; }
    header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; padding: 12px 24px; background: #fff; border-bottom: 1px solid var(--line); }
    main { max-width: 1000px; margin: auto; padding: 24px 16px; }
    a { color: var(--accent); }
    small { color: var(--muted); }
    button, .button { font: inherit; padding: 6px 14px; border: 1px solid var(--line); border-radius: 8px; background: #fff; color: inherit; cursor: pointer; text-decoration: none; }
    .primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    input:not([type=radio]):not([type=file]) { font: inherit; width: 100%; padding: 8px 10px; margin: 4px 0 12px; border: 1px solid var(--line); border-radius: 8px; }
    article, section, dialog { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
    dialog { width: min(460px, 92vw); }
    dialog::backdrop { background: rgb(0 0 0 / 0.45); }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
    .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 6px; border-bottom: 1px solid var(--line); }
  </style>
    <script>
    function signup() {


      fetch("api/signup.php", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: "name="+ encodeURIComponent(document.getElementById("name").value)+"&email="+ encodeURIComponent(document.getElementById("email").value)+"&pass="+encodeURIComponent(document.getElementById("pass").value),
      })
      .then(response => response.text())
      .then(text => {
        text = text.trim();
        if (text === "0" || text === "") {
          alert("Wrong email or password");
          return;
        }

        localStorage.setItem("ticket", text);
        window.location.href = "home.html";
      })
      .catch(() => alert("Could not reach the server"));
    }
  </script>
  
</head>
<body>
  <!-- 1b · Sign up -->
  <main style="max-width: 380px; margin-top: 10vh;">
    <article>
      <h2>Create account</h2>
       <div>
        <label>Name <input type="text" id="name" placeholder="Your name" required></label>
        <label>Email <input type="email" id="email" placeholder="you@school.edu" required></label>
        <label>Password <input type="password" id="pass" required></label>
        <button onclick="signup()" class="primary" style="width: 100%;">Sign Up</button>
      </div>
      <p style="text-align: center;"><small>Already have an account?</small> <a href="login.html">Log in</a></p>
    </article>
  </main>
</body>
</html>
