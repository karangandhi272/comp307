<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>[Group name]</title>
  <style>
    :root { --accent: #1f5f45; --line: #e2e4de; --muted: #6b716c; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 15px/1.5 system-ui, sans-serif; color: #1c1f1d; background: #f6f7f4; }
    header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; padding: 12px 24px; background: #fff; border-bottom: 1px solid var(--line); }
    main { max-width: 1000px; margin: auto; padding: 24px 16px; }
    a { color: var(--accent); }
    small { color: var(--muted); }
    button, .button { font: inherit; padding: 6px 14px; border: 1px solid var(--line); border-radius: 8px; background: #fff; color: inherit; cursor: pointer; text-decoration: none; }
    .primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    input:not([type=radio]):not([type=file]):not([type=checkbox]) { font: inherit; width: 100%; padding: 8px 10px; margin: 4px 0 12px; border: 1px solid var(--line); border-radius: 8px; }
    article, section, dialog { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
    dialog { width: min(460px, 92vw); }
    dialog::backdrop { background: rgb(0 0 0 / 0.45); }
    /* 3 columns: Leaderboard / Quizzes / Members on top, then the notes list and a 2-column-wide reader. */
    .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
    .wide { grid-column: span 2; }
    @media (max-width: 760px) {
      .grid { grid-template-columns: 1fr; }
      .wide { grid-column: auto; }
    }
    .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 6px; border-bottom: 1px solid var(--line); }
    /* Leaderboard has 6 columns in a narrow card, so tighter cells and the score kept on one line */
    #leaderboardHead th, #leaderboardList td { padding: 6px 4px; font-size: 14px; }
    #leaderboardList td:last-child { white-space: nowrap; }
    #notePreview { font: inherit; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 500px; overflow-y: auto; margin: 0; }
    #notesList tr.selected { background: #eef3ef; }
    #notesList tr.selected td:first-child { box-shadow: inset 3px 0 var(--accent); }
  </style>
  <script src="cleanhtml.js"></script>
  <script src="group.js"></script>
</head>
<body>
  <!-- 3a · Group page — includes 3b quiz, 3c results, 3d upload popups -->
  <header>
    <div>
      <a href="home.html">&larr; Home</a>
      <strong id="groupName">Group</strong> <small id="groupMeta"></small>
    </div>
    <nav>
      <small>Code</small> <code id="inviteCode"></code>
      <button onclick="copyCode(this)">Copy</button>
      <button onclick="leaveGroup()">Leave</button>
    </nav>
  </header>

  <main class="grid">
    <section>
      <div class="row">
        <h3>Leaderboard</h3>
        <select id="leaderboardView" onchange="drawLeaderboard()">
          <option value="best">Best scores</option>
          <option value="first">First attempts</option>
        </select>
      </div>
      <table>
        <thead id="leaderboardHead"></thead>
        <tbody id="leaderboardList"></tbody>
      </table>
    </section>

    <section>
      <div class="row">
        <h3>Quizzes</h3>
        <button onclick="openCreateQuiz()">+ New quiz</button>
      </div>
      <table id="quizList"></table>
    </section>

    <section>
      <h3 id="membersTitle">Members</h3>
      <table id="membersList"></table>
    </section>

    <section>
      <h3>Shared notes</h3>
      <table id="notesList"></table>
      <p>
        <button onclick="newNote()">+ New note</button>
        <button onclick="upload.showModal()">+ Upload</button>
      </p>
    </section>

    <section class="wide">
      <div class="row">
        <h3 id="previewTitle">Note preview</h3>
        <button id="editBtn" onclick="startEdit()" hidden>Edit</button>
      </div>
      <pre id="notePreview">Click a note to read it.</pre>

      <div id="editArea" hidden>
        <input id="editTitle" placeholder="Title">
        <textarea id="editContent" rows="12" style="width: 100%; font: inherit;"></textarea>
        <div>
          <button onclick="cancelEdit()">Cancel</button>
          <button class="primary" onclick="saveEdit()">Save</button>
        </div>
      </div>
    </section>
  </main>

  <!-- 3b · Quiz popup -->
  <dialog id="quiz">
    <div class="row">
      <div><small id="quizTitle">Quiz</small><h3 id="quizProgress">Question 1</h3></div>
      <form method="dialog"><button aria-label="Close">&times;</button></form>
    </div>
    <form onsubmit="event.preventDefault()">
      <p id="quizPrompt"></p>
      <div id="quizOptions"></div>
      <div class="row">
        <button type="button" id="quizBack" onclick="moveQuestion(-1)">Back</button>
        <small id="quizAnswered"></small>
        <button type="button" id="quizNext" class="primary" onclick="moveQuestion(1)">Next</button>
      </div>
    </form>
  </dialog>

  <!-- 3c · Quiz results popup -->
  <dialog id="results">
    <div class="row"><small>Quiz submitted</small><form method="dialog"><button aria-label="Close">&times;</button></form></div>
    <h1 id="resultsScore" style="text-align: center; margin: 0;"></h1>
    <p style="text-align: center;"><small>correct answers</small></p>
    <p style="text-align: center;"><strong id="resultsPoints"></strong></p>
    <div id="resultsReview" style="max-height: 50vh; overflow-y: auto;"></div>
  </dialog>

  <!-- Create quiz popup -->
  <dialog id="createQuiz">
    <div class="row"><h3>New quiz</h3><form method="dialog"><button aria-label="Close">&times;</button></form></div>
    <form onsubmit="createQuiz(event)">
      <label>Title <input id="quizTitleInput" maxlength="200" required></label>
      <label>Number of questions <input id="quizCountInput" type="number" min="1" max="20" value="5" required></label>
      <p><small>Notes to quiz on</small></p>
      <div id="quizNotePicker" style="max-height: 200px; overflow-y: auto;"></div>
      <div class="row">
        <button type="button" onclick="document.getElementById('createQuiz').close()">Cancel</button>
        <button type="submit" class="primary">Generate</button>
      </div>
    </form>
  </dialog>

  <!-- 3d · Upload notes popup -->
  <dialog id="upload">
    <div class="row"><h3>Upload notes</h3><form method="dialog"><button aria-label="Close">&times;</button></form></div>
    <form onsubmit="uploadNote(event)">
      <p><input type="file" id="noteFile" accept=".txt" required></p>
      <p><small>TXT files only. Notes are shared with everyone in this group.</small></p>
      <div class="row">
        <button type="button" onclick="upload.close()">Cancel</button>
        <button type="submit" class="primary">Upload</button>
      </div>
    </form>
  </dialog>
</body>
</html>
