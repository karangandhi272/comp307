<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My groups</title>
  <style>
    :root { --accent: #1f5f45; --line: #e2e4de; --muted: #6b716c; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 15px/1.5 system-ui, sans-serif; color: #1c1f1d; background: #f6f7f4; }
    header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; padding: 12px 24px; background: #fff; border-bottom: 1px solid var(--line); }
    main { max-width: 1000px; margin: auto; padding: 24px 16px; }
    a { color: var(--accent); }
    small { color: var(--muted); }
    button, .button { font: inherit; padding: 6px 14px; border: 1px solid var(--line); border-radius: 8px; background: #fff; color: inherit; cursor: pointer; text-decoration: none; }
    .primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    input:not([type=radio]):not([type=file]) { font: inherit; width: 100%; padding: 8px 10px; margin: 4px 0 12px; border: 1px solid var(--line); border-radius: 8px; }
    article, section, dialog { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
    dialog { width: min(460px, 92vw); }
    dialog::backdrop { background: rgb(0 0 0 / 0.45); }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
    .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 6px; border-bottom: 1px solid var(--line); }
  </style>
  <script src="cleanhtml.js" ></script>
  <script>


    function joinGroup() {
      fetch("api/joingroup.php", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: "groupcode="+encodeURIComponent(document.getElementById("code").value)+"&ticket="+ encodeURIComponent(localStorage.getItem("ticket"))
      })
      .then(response => response.json())
    
      .then((output) => {

        if (output === 0){
            alert("Couldn't join: check the code"); 
            return; 
        }
        document.getElementById("addGroup").close();
        getGroups();

      })
      .catch(() => alert("Could not reach the server"));
     
    }


    function createGroup() {
      fetch("api/creategroup.php", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body:"description="+encodeURIComponent(document.getElementById("description").value) + "&groupname="+encodeURIComponent(document.getElementById("group_name").value)+"&ticket="+ encodeURIComponent(localStorage.getItem("ticket"))
      })
      .then(response => response.json())
    
      .then((output) => {
        if (output === 0){
            alert("Couldn't create"); 
            return; 
        }
        document.getElementById("addGroup").close();
        getGroups();

      })
      .catch(() => alert("Could not reach the server"));
    }






    function loadProfile() {
      fetch("api/profile.php", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: "ticket="+ encodeURIComponent(localStorage.getItem("ticket"))
      })
      .then(response => response.json())
      .then(output => {
        if (output === 0) { window.location.href = "login.html"; return; }

        let rows = '';
        for (let i = 0; i < output.groups.length; i++) {
          const role = output.groups[i].role === "leader" ? "Leader" : "Member";
          rows += `<tr><td>${escapeHtml(output.groups[i].name)}</td><td><small>${role}</small></td></tr>`;
        }
        if (rows === '') {
          rows = `<tr><td><small>You haven't joined any groups yet.</small></td></tr>`;
        }

        let htmlContent = `
          <div class="row"><h3>Profile</h3><form method="dialog"><button aria-label="Close">&times;</button></form></div>
          <p><strong>${escapeHtml(output.display_name)}</strong><br><small>${escapeHtml(output.email)}</small></p>
          <p>Groups joined: <strong>${output.groups.length}</strong> · Quizzes taken: <strong>${output.quizzes_taken}</strong></p>
          <table>${rows}</table>
          <p><button onclick="logout()">Log out</button></p>
        `;


        document.getElementById("profile").innerHTML = htmlContent;
        document.getElementById("profile").showModal();
      })
      .catch(() => alert("Could not reach the server"));
    }

    function logout() {
      fetch("api/logout.php", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: "ticket="+ encodeURIComponent(localStorage.getItem("ticket"))
      })
      .then(() => {
        localStorage.removeItem("ticket");
        window.location.href = "index.html";
      });
    }

    function getGroups() {
      fetch("api/allgroups.php", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: "ticket="+ encodeURIComponent(localStorage.getItem("ticket"))
      })
      .then(response => response.json())
      .then(output => {
        if (output === 0) { window.location.href = "login.html"; return; }
        let htmlContent = '';
        for (let i = 0; i < output.length; i++) {
        htmlContent += `
            <article>
              <a href="group.html"><strong>${escapeHtml(output[i].name)}</strong></a>
              <p><small>${escapeHtml(output[i].description)}</small></p>
               <p><small>${escapeHtml(output[i].invite_code)}</small></p>
            </article>
        `;
        }
        htmlContent += `<button style="border-style: dashed;" onclick="addGroup.showModal()">+ Create or join a group</button>`;
 

        document.getElementById("grid").innerHTML = htmlContent;
      })
      .catch(() => alert("Could not reach the server"));
    }

    
    window.addEventListener("load", () => {
      getGroups();

    });
  </script>
</head>
<body>
  <!-- 2a · Home — includes 2b profile + 2c add group popups -->
  <header>
    <strong>[App name]</strong>
    <nav>
      <button class="primary" onclick="addGroup.showModal()">+ Add group</button>
      <button onclick="loadProfile()">Profile</button>
    </nav>
  </header>

  <main>
    <h2>My groups</h2>
    <div class="grid" id="grid">
      <button style="border-style: dashed;" onclick="addGroup.showModal()">+ Create or join a group</button>
    </div>
  </main>

  <dialog id="profile"></dialog>
  <dialog id="addGroup">
    <div class="row"><h3>Add group</h3><form method="dialog"><button aria-label="Close">&times;</button></form></div>
    <div>
      <label>Join with a group code
        <input type="text" id="code" placeholder="e.g. 7F3L-2KQ9" required>
      </label>
      <button onclick="joinGroup() " class="primary">Join</button>
    </div>
    <p style="text-align: center;"><small>or</small></p>
    <div action="#" method="post">
      <label>Create a new group
        <input type="text" id="group_name" placeholder="Group name" required>
        <input type="text" id="description" placeholder="Description" required>

      </label>
      <button onclick="createGroup()">Create</button>
    </form>
  </dialog>


</body>
</html>
